{# TEMPLATE BASE: os outros templates "herdam" dele com {% extends %} #}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Biblioteca{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6fa;
            color: #222;
            font-size: 17px;
        }
        /* Cabeçalho */
        header {
            background: #2b4c7e;
            color: #fff;
            padding: 18px 24px;
        }
        header .topo {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        header h1 { margin: 0; font-size: 24px; }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            margin-left: 6px;
            background: rgba(255,255,255,0.12);
        }
        nav a:hover { background: rgba(255,255,255,0.28); }

        /* Conteúdo */
        main { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        h2 { margin-top: 0; }

        /* Cartões */
        .grade {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 18px;
        }
        .cartao {
            background: #fff;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: block;
            color: inherit;
            text-decoration: none;
        }
        a.cartao:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
        .cartao h3 { margin: 0 0 6px; color: #2b4c7e; }
        .cartao p { margin: 4px 0; color: #555; }

        /* Etiquetas de status */
        .etiqueta {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .disponivel { background: #d8f5df; color: #1d7a36; }
        .emprestado { background: #fde0e0; color: #b02a2a; }

        /* Tabela */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e5e5; }
        th { background: #eef2f8; }

        .vazio {
            background: #fff;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            color: #666;
        }
        .botao {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #2b4c7e;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="topo">
            <h1>📚 Biblioteca</h1>
            <nav>
                <a href="{% url 'livros:lista' %}">Todos os livros</a>
                <a href="{% url 'livros:disponiveis' %}">Disponíveis</a>
                <a href="{% url 'livros:sobre' %}">Sobre</a>
                <a href="/admin/">Admin</a>
            </nav>
        </div>
    </header>

    <main>
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
